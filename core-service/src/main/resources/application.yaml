server:
  port: 8082
  forward-headers-strategy: framework
  upload-dir: uploads

spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://${DB_CORE_HOST:postgres}:${DB_CORE_PORT:5432}/${DB_CORE_NAME:core_db}
    username: ${DB_CORE_USERNAME:core_user}
    password: ${DB_CORE_PASSWORD:core_strong_pass_456}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  servlet:
    multipart:
      # Максимальный размер одного файла
      max-file-size: 5MB
      # Максимальный размер всего запроса (включая текстовые поля и несколько файлов)
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:aZUyHFCj6SUG2hI5sGHFifB2iQkfIY3nTztuTVdws4Ys}

storage:
  payment-qr-dir: ${PAYMENT_QR_DIR:./uploads/payment-qr}

booking:
  payment-timeout-minutes: 15
  expiration-delay-ms: 60000
  no-show-delay-ms: 60000