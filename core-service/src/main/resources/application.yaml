server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://${DB_CORE_HOST:postgres}:${DB_CORE_PORT:5432}/${DB_CORE_NAME:core_db}
    username: ${DB_CORE_USERNAME:core_user}
    password: ${DB_CORE_PASSWORD:core_strong_pass_456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:aZUyHFCj6SUG2hI5sGHFifB2iQkfIY3nTztuTVdws4Ys}