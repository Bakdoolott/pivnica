databaseChangeLog:
  - changeSet:
      id: 019-add-booking-confirmation-fields
      author: Viktor
      changes:
        - addColumn:
            tableName: book_tb
            columns:
              - column:
                  name: payment_sent_at
                  type: TIMESTAMP
              - column:
                  name: confirmed_by
                  type: BIGINT
              - column:
                  name: confirmed_at
                  type: TIMESTAMP
              - column:
                  name: rejection_reason
                  type: VARCHAR(300)
              - column:
                  name: rejected_by
                  type: BIGINT
              - column:
                  name: rejected_at
                  type: TIMESTAMP

        - createIndex:
            tableName: book_tb
            indexName: idx_booking_awaiting_confirmation
            columns:
              - column:
                  name: booking_status
              - column:
                  name: payment_sent_at
            where: booking_status = 'AWAITING_CONFIRMATION'