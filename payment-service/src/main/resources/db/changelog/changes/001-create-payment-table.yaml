databaseChangeLog:
  - changeSet:
      id: 001-create-payment-table
      author: Bakdoolott

      changes:
        - createSequence:
            sequenceName: payment_seq
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: payment_tb

            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: payment_seq
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: booking_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
                    unique: true
                    uniqueConstraintName: uq_payment_idempotency_key

              # Идентификатор транзакции у платёжного провайдера.
              # Для мока не используется, оставлено под реальный шлюз.
              - column:
                  name: provider_ref
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueDate: now()
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createIndex:
            tableName: payment_tb
            indexName: idx_payment_booking_id
            columns:
              - column:
                  name: booking_id

        - createIndex:
            tableName: payment_tb
            indexName: idx_payment_status
            columns:
              - column:
                  name: status
