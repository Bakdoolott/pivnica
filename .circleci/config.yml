version: 2.1

jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:2024.01.1

    steps:
      - checkout

      - run:
          name: Build and push Docker images
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin

            docker build -t mirlanuulubakdoolot293/gateway:latest ./gateway
            docker tag mirlanuulubakdoolot293/gateway:latest \
              mirlanuulubakdoolot293/gateway:${CIRCLE_SHA1}

            docker push mirlanuulubakdoolot293/gateway:latest
            docker push mirlanuulubakdoolot293/gateway:${CIRCLE_SHA1}

            docker build -t mirlanuulubakdoolot293/auth:latest ./auth_service
            docker tag mirlanuulubakdoolot293/auth:latest \
              mirlanuulubakdoolot293/auth:${CIRCLE_SHA1}

            docker push mirlanuulubakdoolot293/auth:latest
            docker push mirlanuulubakdoolot293/auth:${CIRCLE_SHA1}

            docker build -t mirlanuulubakdoolot293/core:latest ./core-service
            docker tag mirlanuulubakdoolot293/core:latest \
              mirlanuulubakdoolot293/core:${CIRCLE_SHA1}

            docker push mirlanuulubakdoolot293/core:latest
            docker push mirlanuulubakdoolot293/core:${CIRCLE_SHA1}

workflows:
  workflow:
    jobs:
      - build-and-push:
          filters:
            branches:
              only: dev